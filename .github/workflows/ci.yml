name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  NODE_VERSION: 20
  APP_URL: http://localhost:3000/health
  SESSION_SECRET: ci_dummy_session_secret
  IMAGE_NAME: my-backend-app

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  docker:
    name: Docker build and health check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -t course-management:test .

      - name: Start Compose stack
        run: docker compose up -d --build

      - name: Show containers
        run: docker compose ps

      - name: Wait for health endpoint
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error "$APP_URL"; then
              exit 0
            fi

            sleep 2
          done

          docker compose logs
          exit 1

      - name: Stop Compose stack
        if: always()
        run: docker compose down

  publish:
    name: Publish Docker image
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
