services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db

  backend:
    build: .
    image: bken824/my-backend-app:1.1
    ports:
      - "3000:3000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/baokim_dev
      - SESSION_SECRET=${SESSION_SECRET}
      - PORT=3000
      - NODE_ENV=development
      - AUTO_SEED=true
      - SEED_DEMO_CONTENT=true
      - SEED_ADMIN_NAME=Demo Admin
      - SEED_ADMIN_EMAIL=admin@demo.local
      - SEED_ADMIN_PASSWORD=Admin123
      - SEED_ADMIN_RESET_PASSWORD=false
    depends_on:
      - mongo

volumes:
  mongo-data: